spring.application.name=BE

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiz_app}
spring.datasource.username=${DB_USERNAME:quiz_app}
spring.datasource.password=${DB_PASSWORD:quiz_app}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:12}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
