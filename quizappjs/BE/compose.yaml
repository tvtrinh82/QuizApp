services:
  postgres:
    image: postgres:16-alpine
    container_name: be-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz_app
      POSTGRES_USER: quiz_app
      POSTGRES_PASSWORD: quiz_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_app -d quiz_app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
